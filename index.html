<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #666;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #24292f;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>مرحبًا بك في موقعي 👋</h1>

    <p>
      هذا أول موقع لي على GitHub Pages.
    </p>

    <a class="button" href="#">
      ابدأ الآن
    </a>
  </div>

</body>
</html>
